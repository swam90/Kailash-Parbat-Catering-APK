<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kailash Parbat">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4A7C3F">
<title>Kailash Parbat</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="./favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<style>
:root{--ink:#242321;--deep:#4A7C3F;--leaf:#7DBD53;--mist:#EEF5E8;--bg:#F6F8F3;--line:#DDE5D6;--mut:#6B7466;--red:#C0392B}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{background:var(--deep);padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.lg{background:#fff;border-radius:10px;padding:4px 10px;display:flex}.lg img{height:28px}
header h1{color:#fff;font-size:19px;font-weight:700;flex:1;text-align:right}
main{flex:1;overflow-y:auto;padding:14px 14px 96px;-webkit-overflow-scrolling:touch}
nav{display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 0 6px;font:600 11px system-ui,sans-serif;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:22px;filter:grayscale(1);opacity:.55}
nav button.on{color:var(--deep)}nav button.on i{filter:none;opacity:1}
.fab{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;border:0;background:var(--leaf);color:var(--ink);font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.28);z-index:10}
h3{font-size:13px;color:var(--mut);margin:20px 2px 8px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-left:4px solid var(--leaf);border-radius:12px;padding:12px}
.tile b{display:block;font-size:22px;color:var(--ink)}.tile span{font-size:12px;color:var(--mut)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.card:active{background:var(--mist)}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.id{font-size:11px;font-weight:700;color:var(--deep)}.nm{font-size:16px;font-weight:700;margin:2px 0}.sb{font-size:12px;color:var(--mut)}
.bd{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;background:#E9E9E6;color:#555}
.bd.New,.bd.Draft{background:#E3EEFB;color:#2F6DB5}.bd.Contacted,.bd.Sent,.bd.Quoted,.bd.Unpaid{background:#FBF0D9;color:#8A5E00}
.bd.Accepted,.bd.Paid{background:#E0F1D6;color:#2F6A1F}.bd.Rejected{background:#F9E0DC;color:var(--red)}
.empty{text-align:center;color:var(--mut);padding:40px 20px}
.sr{margin-bottom:12px;border-radius:24px}
#bd{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:.25s;z-index:50}#bd.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:90vh;max-height:90dvh;overflow-y:auto;background:#fff;border-radius:20px 20px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s;z-index:51}
#sheet.on{transform:none}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.sh-t{font-size:18px;font-weight:700;margin-bottom:6px}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--deep)}textarea{min-height:70px}
.it{display:grid;grid-template-columns:1fr 54px 82px 34px;gap:6px;margin-bottom:6px}.it input{padding:9px 8px;font-size:15px}
.it button{border:0;background:#F9E0DC;color:var(--red);border-radius:8px}
.chk{display:flex;align-items:center;gap:8px}.chk input{width:auto}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}.kv span{color:var(--mut)}.kv b{text-align:right}
.tot{font-size:17px;border-bottom:0}.tot span,.tot b{color:var(--deep);font-weight:800}
.pri,.ghost,.dng{width:100%;padding:13px;border-radius:12px;font:700 15px system-ui,sans-serif;border:1.5px solid var(--deep);margin-top:12px}
.pri{background:var(--deep);color:#fff}.ghost{background:#fff;color:var(--deep)}.dng{background:#fff;color:var(--red);border-color:#E8C4BE}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 70px);left:14px;right:14px;background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-weight:600;z-index:99;text-align:center}
.hint{font-size:11px;color:var(--mut);margin-top:3px}.note{font-size:12px;color:var(--mut);margin-top:10px}
</style>
</head>

const EV=['Banquet','Dining reservation','Corporate event','Wedding','Birthday / party','Catering delivery','Other'];

 quote:{t:'Quotes',one:'Quotation',p:'QT-',doc:1,st:['Draft','Sent','Accepted','Rejected'],f:[...base,['slot','Event slot','select',SL],['venue','Venue','text'],['fn','From – name','text'],['fc','From – contact','text'],['notes','General terms and conditions','textarea']]},

};
const TABS=[['home','📊','Home'],['inq','📋','Inquiries'],['quote','📝','Quotes'],['inv','🧾','Invoices'],['cust','👥','Customers']];
let tab='home',q='',PRE={},dip;
$('#nav').innerHTML=TABS.map(t=>`<button data-t="${t[0]}" onclick="go('${t[0]}')"><i>${t[1]}</i>${t[2]}</button>`).join('');
const go=t=>{tab=t;q='';render()};
function render(){
 $('#ttl').textContent=tab=='home'?'Dashboard':CFG[tab].t;
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
 $('.fab').style.display=tab=='home'?'none':'block';
 $('#main').innerHTML=tab=='home'?home():`<input class="sr" id="sr" placeholder="Search…" oninput="q=this.value;fill()"><div id="lst"></div>`;
 if(tab!='home')fill();
 $('#main').scrollTop=0;
}
function fill(){
 const L=S[tab].filter(o=>JSON.stringify({...o,menu:0}).toLowerCase().includes(q.toLowerCase()));
 $('#lst').innerHTML=L.length?L.map(o=>card(tab,o)).join(''):`<div class="empty">${q?'No matches.':'Nothing here yet.<br>Tap + to add '+CFG[tab].one.toLowerCase()+'.'}</div>`;
}
const card=(k,o)=>{
 const sub=k=='cust'?[o.phone,o.company]:[fd(o.date),o.pax&&o.pax+' guests',o.phone];
 return `<div class="card" onclick="view('${k}','${o.id}')"><div class="r"><span class="id">${o.id}</span>${o.status?`<span class="bd ${o.status}">${o.status}</span>`:''}</div><div class="nm">${esc(o.name)}</div><div class="r"><span class="sb">${esc(sub.filter(Boolean).join(' · '))}</span>${CFG[k].doc?`<b>${money(total(o).t)}</b>`:''}</div></div>`;
};
function home(){
 const sum=l=>l.reduce((a,x)=>a+total(x).t,0);
 const T=(n,l,t)=>`<div class="tile" onclick="go('${t}')"><b>${n}</b><span>${l}</span></div>`;
 return `<div class="grid">${T(S.inq.filter(x=>x.status=='New').length,'New inquiries','inq')}${T(S.quote.filter(x=>x.status=='Sent').length,'Quotes awaiting reply','quote')}${T(money(sum(S.inv.filter(x=>x.status!='Paid'))),'Unpaid invoices','inv')}${T(money(sum(S.inv.filter(x=>x.status=='Paid'))),'Payments received','inv')}</div>

function view(k,id){
 const o=S[k].find(x=>x.id==id),c=CFG[k];
 let h=`<div class="sh-t">${o.id} · ${esc(o.name)}</div>`;
 h+=c.f.filter(f=>f[0]!='name'&&o[f[0]]).map(f=>`<div class="kv"><span>${f[1]}</span><b>${esc(f[2]=='date'?fd(o[f[0]]):o[f[0]])}</b></div>`).join('');
 if(c.doc){const t=total(o);h+=o.items.map(i=>`<div class="kv"><span>${esc(i.d)} × ${i.q}</span><b>${money(i.q*i.p)}</b></div>`).join('')+(o.gst?`<div class="kv"><span>GST 9%</span><b>${money(t.g)}</b></div>`:'')+`<div class="kv tot"><span>Total</span><b>${money(t.t)}</b></div>`}
 if(o.menu)h+=`<div class="kv"><span>Menu</span><b><a href="#" onclick="openMenu('${k}','${id}');return false" style="color:var(--deep)">${esc(o.menu.name)}</a></b></div>`;
 if(c.st)h+=`<label>Status</label><select onchange="setSt('${k}','${id}',this.value)">${c.st.map(s=>`<option ${s==o.status?'selected':''}>${s}</option>`).join('')}</select>`;
 const B=(t,f,cl)=>`<button class="${cl||'ghost'}" onclick="${f}">${t}</button>`;
 h+='<div class="acts">'+B('Edit',`openForm('${k}','${id}')`,'pri')
  +(k=='inq'?B('Create quote',`mkQuote('${id}')`):'')+(k=='quote'?B('Create invoice',`mkInv('${id}')`):'')+(k=='cust'?B('New inquiry',`openForm('inq','',{name:'${esc(o.name).replace(/'/g,'')}',phone:'${esc(o.phone||'')}'})`):'')

 if(c.doc)h+=`<label>${c.one} number *</label><input id="no" value="${esc(id||nid(k,c.p))}"><div class="hint">Type your own number or keep the suggestion</div>`;
 h+=c.f.map(f=>{const v=o[f[0]]??'',a=`data-f="${f[0]}"`;
  return `<label>${f[1]}${f[3]===1?' *':''}</label>`+(f[2]=='select'?`<select ${a}>${f[3].map(s=>`<option value="${s}" ${s==v?'selected':''}>${s||'Select…'}</option>`).join('')}</select>`:f[2]=='textarea'?`<textarea ${a}>${esc(v)}</textarea>`:`<input ${a} type="${f[2]}" value="${esc(v)}">`)+(f[0]=='venue'?'<div class="hint">Type a 6-digit Singapore postal code to auto-fill the address</div>':'')}).join('');
 if(c.doc)h+=`<label>Items</label><div id="its"></div><button class="ghost" style="margin-top:4px" onclick="row()">+ Add item</button><label>Menu (image or PDF)</label><input type="file" id="mf" accept="image/*,application/pdf" onchange="pickMenu(this.files[0])"><div class="hint" id="mn">${o.menu?esc(o.menu.name)+' attached':'No menu attached'}</div><button class="dng" style="margin-top:6px;padding:8px" onclick="MENU=null;$('#mn').textContent='Menu removed';$('#mf').value=''">Remove menu</button><label class="chk"><input type="checkbox" id="gst" ${o.gst===0?'':'checked'}> Add 9% GST</label><div class="kv tot"><span>Total</span><b id="tt"></b></div>`;
 h+=`<button class="pri" onclick="sv('${k}','${id||''}')">Save</button>`;
 sheet(h);
 if(c.doc){(o.items||[{d:'',q:1,p:''}]).forEach(i=>row(i));calc()}
}
function row(i){
 i=i||{d:'',q:1,p:''};const r=document.createElement('div');r.className='it';
 r.innerHTML=`<input placeholder="Item" value="${esc(i.d)}"><input type="number" inputmode="decimal" placeholder="Qty" value="${i.q}"><input type="number" inputmode="decimal" placeholder="Price" value="${i.p}"><button onclick="this.parentNode.remove();calc()">✕</button>`;
 $('#its').append(r);
}
const items=()=>[...document.querySelectorAll('#its .it')].map(r=>{const n=r.querySelectorAll('input');return{d:n[0].value.trim(),q:+n[1].value||0,p:+n[2].value||0}}).filter(i=>i.d||i.p);
function calc(){if($('#tt'))$('#tt').textContent=money(total({items:items(),gst:$('#gst').checked}).t)}
$('#sb').addEventListener('input',calc);$('#sb').addEventListener('change',calc);
function sv(k,id){
 const c=CFG[k],{_k,_id,_st,...pre}=PRE;
 const o=id?{...S[k].find(x=>x.id==id)}:{id:nid(k,c.p),created:Date.now(),status:c.st&&c.st[0],...pre};
 document.querySelectorAll('#sb [data-f]').forEach(e=>o[e.dataset.f]=e.value.trim());
 if(!o.name)return toast('Enter the customer name');
 if(c.doc){o.items=items();o.gst=$('#gst').checked?1:0;o.menu=MENU||undefined;
  const nn=$('#no').value.replace(/['"`\\<>&]/g,'').trim();if(!nn)return toast('Enter the '+c.one.toLowerCase()+' number');
  if(S[k].some(x=>x.id==nn&&x.id!=id))return toast(nn+' already exists');
  o.id=nn;if(id&&id!=nn)S[k]=S[k].filter(x=>x.id!=id)}
 put(k,o);
 if(k!='cust'&&!S.cust.some(x=>x.name.toLowerCase()==o.name.toLowerCase()))put('cust',{id:nid('cust','C-'),name:o.name,phone:o.phone||'',created:Date.now()});
 if(!id&&_k){const s=S[_k].find(x=>x.id==_id);if(s){s.status=_st;save(_k,S[_k])}}
 closeSh();render();toast('Saved '+o.id);
}
const mkQuote=id=>{const o=S.inq.find(x=>x.id==id);openForm('quote','',{name:o.name,phone:o.phone,date:o.date,pax:o.pax,venue:o.venue,slot:o.slot,items:[{d:'Catering package',q:+o.pax||1,p:''}],gst:1,_k:'inq',_id:id,_st:'Quoted'})};
const mkInv=id=>{const o=S.quote.find(x=>x.id==id);openForm('inv','',{name:o.name,phone:o.phone,date:o.date,pax:o.pax,venue:o.venue,slot:o.slot,fn:o.fn,fc:o.fc,notes:o.notes,items:o.items,gst:o.gst,_k:'quote',_id:id,_st:'Accepted'})};
function share(k,id){
 const o=S[k].find(x=>x.id==id),t=total(o),p=(o.phone||'').replace(/\D/g,''),n=p.length==8?'65'+p:p;
 const tx=`*Kailash Parbat Restaurants Pte Ltd*\n${CFG[k].one} ${o.id}\nCustomer: ${o.name}${o.date?'\nEvent: '+fd(o.date):''}${o.pax?' · '+o.pax+' guests':''}\n\n`+o.items.map(i=>`• ${i.d} × ${i.q} = ${money(i.q*i.p)}`).join('\n')+(o.gst?`\nGST 9%: ${money(t.g)}`:'')+`\n*Total: ${money(t.t)}*`+(o.notes?'\n\n'+o.notes:'');
 window.open('https://wa.me/'+n+'?text='+encodeURIComponent(tx),'_blank');
}
function prt(k,id){
 const o=S[k].find(x=>x.id==id),t=total(o),w=window.open('','_blank');if(!w)return toast('Allow pop-ups to print');
 const q=k=='quote',tm=(o.notes||'').split('\n').filter(x=>x.trim()),m=o.menu,
 dt=new Date(o.created||Date.now()).toLocaleDateString('en-SG',{day:'numeric',month:'short',year:'numeric'});
 w.document.write(`<title>${esc(o.id)}</title><style>body{font:13px system-ui,sans-serif;max-width:720px;margin:20px auto;padding:0 16px;color:#242321}table{border-collapse:collapse;width:100%}th{background:#4A7C3F;color:#fff;padding:7px;text-align:left}td{padding:7px;border-bottom:1px solid #ddd}.r{text-align:right}h1{margin:0;color:#4A7C3F;font-size:26px;letter-spacing:1px}.g{color:#6B7466;font-size:12px}.bx{border:1px solid #DDE5D6;border-radius:8px;padding:10px;flex:1}@media print{th{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style>`
 +`<div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #7DBD53;padding-bottom:12px"><div><img src="${LOGO}" height="46"><div class="g" style="margin-top:6px"><b>Kailash Parbat Restaurants Pte Ltd</b>${CO.addr?'<br>'+esc(CO.addr).replace(/\n/g,'<br>'):''}${CO.contact?'<br>'+esc(CO.contact):''}${CO.uen?'<br>'+esc(CO.uen):''}</div></div><div class="r"><h1>${q?'QUOTATION':'INVOICE'}</h1><b>No: ${esc(o.id)}</b><br><span class="g">Date: ${dt}</span></div></div>`
 +`<div style="display:flex;gap:10px;margin:14px 0"><div class="bx"><div class="g">From</div><b>${esc(o.fn||CO.fn||'Rajesh Paswan')}</b><br>${esc(o.fc||CO.fc||'+65 8376 3519')}</div><div class="bx"><div class="g">${q?'Quoted to':'Bill to'}</div><b>${esc(o.name)}</b>${o.phone?'<br>'+esc(o.phone):''}</div><div class="bx"><div class="g">Event</div>${o.date?fd(o.date):'-'}${o.slot?' · '+o.slot:''}${o.pax?'<br>'+o.pax+' guests':''}${o.venue?'<br>'+esc(o.venue):''}</div></div>`
 +`<table><tr><th>#<th>Description<th class="r">Qty<th class="r">Price<th class="r">Amount</tr>${o.items.map((i,n)=>`<tr><td>${n+1}<td>${esc(i.d)}<td class="r">${i.q}<td class="r">${money(i.p)}<td class="r">${money(i.q*i.p)}</tr>`).join('')}</table>`
 +`<p class="r">Subtotal: ${money(t.sub)}<br>${o.gst?'GST 9%: '+money(t.g)+'<br>':''}<b style="font-size:18px;color:#4A7C3F">Total: ${money(t.t)}</b></p>`
  +(!q&&CO.bank?`<div class="bx" style="margin:10px 0"><b>Payment details</b><br>${esc(CO.bank).replace(/\n/g,'<br>')}</div>`:'')
 +(tm.length?`<p><b>General terms and conditions</b></p><ol class="g">${tm.map(x=>'<li>'+esc(x.replace(/^\s*\d+[.)]\s*/,''))+'</li>').join('')}</ol>`:'')
 +`<div style="display:flex;justify-content:space-between;margin-top:46px" class="g"><div style="border-top:1px solid #999;width:200px;padding-top:4px">Authorised signature</div></div>`
 +(m&&m.type.startsWith('image')?`<div style="page-break-before:always"><h3 style="color:#4A7C3F">Menu</h3><img src="${m.data}" style="max-width:100%"></div>`:m?`<p class="g">Menu attached as PDF: ${esc(m.name)} (send it along with this document)</p>`:''));
 w.document.close();setTimeout(()=>w.print(),800);
}
function pickMenu(f){
 if(!f)return;const set=(d)=>{MENU={name:f.name,type:f.type,data:d};$('#mn').textContent=f.name+' attached'};
 if(f.type=='application/pdf'){if(f.size>1.5e6){$('#mf').value='';return toast('PDF too large (max 1.5 MB)')}const r=new FileReader();r.onload=()=>set(r.result);r.readAsDataURL(f);return}
 if(!f.type.startsWith('image/')){$('#mf').value='';return toast('Choose an image or PDF')}
 const im=new Image();im.onload=()=>{const sc=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);set(c.toDataURL('image/jpeg',.75))};im.src=URL.createObjectURL(f);
}
function openMenu(k,id){const m=S[k].find(x=>x.id==id).menu;fetch(m.data).then(r=>r.blob()).then(b=>window.open(URL.createObjectURL(b),'_blank'))}
const HD=['Type','No','Status','Name','Phone/Email','Company','Event date','Guests','Event type','Venue','Items','Subtotal','GST','Total','Notes'];
function rows(){const R=[];[['inq','Inquiry'],['quote','Quotation'],['inv','Invoice'],['cust','Customer']].forEach(([k,l])=>S[k].forEach(o=>{const t=CFG[k].doc?total(o):null;R.push([l,o.id,o.status||'',o.name,o.phone||o.email||'',o.company||'',o.date||'',o.pax||'',o.type||'',o.venue||'',(o.items||[]).map(i=>i.d+' x'+i.q+' @'+i.p).join('; '),t?t.sub.toFixed(2):'',t?t.g.toFixed(2):'',t?t.t.toFixed(2):'',o.notes||''])}));return R}
function dl(n,mime,txt){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:mime}));a.download=n;a.click()}
function exp(f){
 const n='kailash-parbat-'+new Date().toISOString().slice(0,10);
 if(f=='json')return dl(n+'.json','application/json',JSON.stringify({...S,co:CO}));
 const R=rows(),tb=`<table border="1" cellpadding="4" style="border-collapse:collapse;font:12px sans-serif"><tr>${HD.map(h=>`<th style="background:#4A7C3F;color:#fff">${h}</th>`).join('')}</tr>${R.map(r=>'<tr>'+r.map(c=>`<td>${esc(c)}</td>`).join('')+'</tr>').join('')}</table>`;
 if(f=='csv')return dl(n+'.csv','text/csv','\ufeff'+[HD,...R].map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n'));
 if(f=='xls')return dl(n+'.xls','application/vnd.ms-excel','<html><head><meta charset="utf-8"></head><body>'+tb+'</body></html>');
 const w=window.open('','_blank');if(!w)return toast('Allow pop-ups to print');
 w.document.write('<title>'+n+'</title><body style="font-family:sans-serif"><img src="'+LOGO+'" height="40"><h3 style="color:#4A7C3F">Kailash Parbat – records</h3>'+tb);w.document.close();setTimeout(()=>w.print(),500);
}
function expSheet(){sheet(`<div class="sh-t">Download backup / export</div><button class="pri" onclick="exp('json')">JSON – full backup (restorable)</button><button class="ghost" onclick="exp('xls')">Excel (.xls)</button><button class="ghost" onclick="exp('csv')">CSV</button><button class="ghost" onclick="exp('pdf')">PDF report (print / save as PDF)</button><p class="note">Excel, CSV and PDF are for reading and sharing. Only JSON can be restored into the app.</p>`)}
function coSheet(){sheet(`<div class="sh-t">Company details &amp; terms</div><div class="note">Printed on quotations and invoices.</div>`+[['fn','From – name (default)','text'],['fc','From – contact (default)','text'],['addr','Address','textarea'],['contact','Phone / email','text'],['uen','UEN / GST reg. no.','text'],['bank','Bank / PayNow details (invoices)','textarea'],['terms','Default general terms and conditions (one per line)','textarea']].map(f=>`<label>${f[1]}</label>`+(f[2]=='textarea'?`<textarea id="co_${f[0]}">${esc(CO[f[0]]||'')}</textarea>`:`<input id="co_${f[0]}" value="${esc(CO[f[0]]||'')}">`)).join('')+`<button class="pri" onclick="saveCo()">Save</button>`)}
function saveCo(){['fn','fc','addr','contact','uen','bank','terms'].forEach(f=>CO[f]=$('#co_'+f).value.trim());try{localStorage.setItem(K+'co',JSON.stringify(CO))}catch{}closeSh();toast('Saved')}
async function pc(e){
 const m=e.value.trim().match(/^(\d{6})(?:\s+(.*))?$/);if(!m)return;const v=e.value;
 try{const r=await fetch('https://www.onemap.gov.sg/api/common/elastic/search?searchVal='+m[1]+'&returnGeom=N&getAddrDetails=Y&pageNum=1'),j=await r.json(),a=j.results&&j.results[0];
  if(!a)return toast('Postal code '+m[1]+' not found');
  if(e.value!==v)return;
  const nice=x=>String(x||'').toLowerCase().replace(/\b\w/g,c=>c.toUpperCase()),ok=x=>x&&x!='NIL';
  e.value=[ok(a.BUILDING)?nice(a.BUILDING):'',(ok(a.BLK_NO)?a.BLK_NO+' ':'')+nice(a.ROAD_NAME),m[2]||''].filter(Boolean).join(', ')+', Singapore '+m[1];
 }catch{toast('No connection – type the address manually')}
}
$('#sb').addEventListener('input',e=>{if(e.target.dataset.f=='venue'&&/^\d{6}$/.test(e.target.value.trim()))pc(e.target)});
$('#sb').addEventListener('change',e=>{if(e.target.dataset.f=='venue')pc(e.target)});
function rst(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);Object.keys(S).forEach(k=>{if(Array.isArray(d[k])){S[k]=d[k];save(k,d[k])}});if(d.co&&typeof d.co=='object'){Object.keys(CO).forEach(x=>delete CO[x]);Object.assign(CO,d.co);try{localStorage.setItem(K+'co',JSON.stringify(CO))}catch{}}render();toast('Backup restored')}catch{toast('Not a valid backup file')}};r.readAsText(f)}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;if(tab=='home')render()});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js');
render();
</script>
</body>
</html>
